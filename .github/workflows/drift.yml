name: drift

on:
  push:
    branches: [main, v1]
  pull_request:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: marketplace
          fetch-depth: 0

      # Invariant: GENERATED_FROM is the prompt-factory commit whose generators produced
      # this repo's generated files. It is NOT meant to track prompt-factory's tip; later
      # prompt-factory commits that do not change output leave it valid. Do not "fix" it
      # by chasing the tip. Update it only together with regenerated output.
      - name: Read the recorded prompt-factory commit
        id: source
        run: echo "sha=$(tr -d '[:space:]' < marketplace/GENERATED_FROM)" >> "$GITHUB_OUTPUT"

      - name: Check out prompt-factory at that exact commit
        uses: actions/checkout@v4
        with:
          repository: constellize/prompt-factory
          ref: ${{ steps.source.outputs.sha }}
          path: prompt-factory

      - uses: actions/setup-node@v4
        with:
          # Verified locally on 26.8.2 only; nothing has run in Actions yet. This pin floats
          # to the latest 26.x. Re-verify before moving to an LTS.
          node-version: 26
          cache: npm
          cache-dependency-path: prompt-factory/package-lock.json

      - name: Install prompt-factory
        working-directory: prompt-factory
        run: npm ci

      - name: Generated files match the recorded commit
        working-directory: prompt-factory
        run: npm run check:drift -- --target marketplace --against "$GITHUB_WORKSPACE/marketplace"

      - name: Skill changes bump the plugin version
        if: ${{ !cancelled() }}
        working-directory: marketplace
        env:
          ALLOW_UNKNOWN_BASE: ${{ github.event_name == 'push' && '1' || '' }}
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: .github/scripts/check-version-bump.sh "$BASE"
